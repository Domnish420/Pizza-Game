<style>
/* Layout: one landscape screen. Top bar, icon rail on the left, scrolling pane; service is three columns around the bench. */

}
html { font-size: 13px; height: 100%; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--body); font-weight: 500; overflow: hidden;

#app { position: relative; height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#hub, #service { height: 100%; display: flex; flex-direction: column; }

.btn { background: var(--cheese); color: var(--ink-dark); border: 0; border-radius: .6rem; padding: .55rem .9rem; font-weight: 800; box-shadow: 0 .18rem 0 #b98e25; white-space: nowrap; }
.btn:active { transform: translateY(.12rem); box-shadow: 0 .06rem 0 #b98e25; }
.btn:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn.sm { padding: .35rem .65rem; font-size: .88rem; }

.btn:disabled { opacity: .4; box-shadow: none; cursor: default; }
.btn.open { background: var(--tomato); color: #fff; box-shadow: 0 .18rem 0 #9c3220; font-family: var(--display); font-weight: 400; font-size: 1.05rem; letter-spacing: .03em; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: .3rem; }
.tag { font-size: .75rem; font-weight: 700; background: var(--panel-2); color: var(--muted); border-radius: 1rem; padding: .2rem .55rem; display: inline-block; }
.tag.ok { color: var(--basil); }
.neg { color: var(--tomato) !important; } .pos { color: var(--basil); }

/* top bar */
#top, .sv-top { display: flex; align-items: center; gap: .5rem; padding: .4rem 0; flex: none; font-variant-numeric: tabular-nums; }
.venue { font: 400 1.15rem var(--display); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.venue b { font-weight: 400; }
.chip { background: var(--panel); border-radius: 1rem; padding: .25rem .6rem; font-size: .85rem; font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: .35rem; }
.xp, .bar, .clock { display: inline-block; width: 3.2rem; height: .4rem; background: var(--bg); border-radius: 1rem; overflow: hidden; }
.xp i, .bar i, .clock i { display: block; height: 100%; background: var(--basil); }
.bar { width: 100%; height: .5rem; margin: .4rem 0; background: var(--bg); } .bar i { background: var(--cheese); }
.cash { font: 400 1.2rem var(--display); color: var(--cheese); }

/* hub */
.hub-body { flex: 1; min-height: 0; display: flex; gap: .5rem; padding-bottom: .4rem; }
#rail { display: flex; flex-direction: column; gap: .2rem; overflow-y: auto; flex: none; width: 4.6rem; scrollbar-width: none; }
#rail button { background: none; border: 0; border-radius: .6rem; padding: .25rem 0; font-size: .7rem; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; align-items: center; flex: 1; justify-content: center; min-height: 2.3rem; }
#rail button span { font-size: 1.15rem; line-height: 1.1; }
#rail button.on { background: var(--panel); color: var(--ink); }
#pane { flex: 1; min-width: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-right: .2rem; }

.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.strip { display: flex; align-items: center; justify-content: space-between; gap: .6rem; background: var(--panel-2); border-radius: .8rem; padding: .5rem .75rem; margin-bottom: .5rem; font-size: .85rem; }
.strip > span:first-child { min-width: 0; }
.seg { display: flex; background: var(--bg); border-radius: .6rem; padding: .15rem; flex: none; }
.seg button { background: none; border: 0; border-radius: .5rem; padding: .3rem .6rem; font-weight: 700; font-size: .85rem; color: var(--muted); }
.seg button.on { background: var(--cheese); color: var(--ink-dark); }
.todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .3rem; font-size: .88rem; }
.todo li { padding-left: 1.3rem; position: relative; }
.todo li::before { position: absolute; left: 0; font-weight: 800; }
.todo .ok::before { content: '✓'; color: var(--basil); } .todo .warn::before { content: '!'; color: var(--cheese); } .todo .bad::before { content: '✕'; color: var(--tomato); }
.hint { color: var(--muted); font-size: .82rem; line-height: 1.35; }

/* modal + toast */
#modal { position: absolute; inset: 0; background: rgba(10, 16, 12, .78); display: flex; align-items: center; justify-content: center; z-index: 20; padding: .6rem; }
.sheet { background: var(--panel); border-radius: 1rem; padding: 1rem 1.2rem; width: min(100%, 38rem); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: .55rem; align-items: center; text-align: center; }
.sheet h3 small { display: inline; font: 700 .85rem var(--body); margin-left: .5rem; }
.sum { display: flex; gap: 1.2rem; width: 100%; text-align: left; }
.sum table { flex: 1; border-collapse: collapse; font-size: .88rem; font-variant-numeric: tabular-nums; }
.sum td { padding: .14rem 0; } .sum td:last-child { text-align: right; font-weight: 800; }
.sum .tot td { border-top: 1px solid var(--line); padding-top: .3rem; font-size: 1rem; }
.lvlup { background: var(--cheese); color: var(--ink-dark); border-radius: .6rem; padding: .35rem .7rem; font-weight: 800; font-size: .88rem; }
#toast { position: absolute; left: 50%; bottom: 1rem; transform: translateX(-50%); background: var(--ink); color: var(--ink-dark); border-radius: 2rem; padding: .45rem 1rem; font-weight: 800; font-size: .9rem; z-index: 30; pointer-events: none; max-width: 90%; text-align: center; }
#toast.bad { background: var(--tomato); color: #fff; }
.meter { position: relative; width: 100%; height: 1.2rem; background: var(--bg); border-radius: 1rem; overflow: hidden; flex: none; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cheese); width: 0; }
.meter u { position: absolute; top: 0; bottom: 0; background: rgba(116, 196, 122, .55); border-inline: 2px solid var(--basil); z-index: 1; }
.pour { display: flex; align-items: center; gap: .6rem; width: 100%; } .pour .meter { flex: 1; width: auto; min-width: 0; } .pour > span { width: 5rem; text-align: left; font-weight: 800; } .pour .btn { flex: none; width: 8rem; touch-action: none; }

.cv-box { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }

#sv-side { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: .35rem; background: var(--panel); border-radius: .7rem; padding: .5rem; scrollbar-width: none; }
.check { list-style: none; margin: 0; padding: 0; font-size: .8rem; display: flex; flex-direction: column; gap: .1rem; }

.slot.ok { background: #2f7a36; } .slot.ok em { color: #fff; } .slot.burn { background: #8c2a1b; }
.slot-bar { position: relative; height: .45rem; background: rgba(0, 0, 0, .35); border-radius: 1rem; overflow: hidden; }

/* held upright: the game turns itself sideways */
body.rot #app { position: fixed; top: 0; left: 0; transform-origin: top left; transform: rotate(90deg) translateY(-100%); padding: 0 8px; }
@media (prefers-reduced-motion: no-preference) { .btn { transition: transform .05s; } .tk { animation: pop .25s; } @keyframes pop { from { transform: translateX(-1rem); opacity: 0; } } }

const xpNeed = l => Math.round(100 * Math.pow(l, 1.3) + 50);
function addXP(n) {
  G.xp += Math.round(n);

  while (G.xp >= xpNeed(G.level)) { G.xp -= xpNeed(G.level); G.level++; ups++; }
  return ups;
}
function unlocksAt(l) {

  return out;
}

const tier = id => UPG[id].tiers[G.upg[id]];

const skillOf = r => staffOf(r).reduce((a, s) => a + s.skill, 0);

/* Everything the upgrades and staff add up to */
function calc() {
  const v = VENUES[G.venue], c = { v };
  const oven = tier('oven');
  c.slots = oven.slots; c.ovenQ = oven.q;
  c.fornaio = staffOf('fornaio').length > 0;
  c.bake = oven.bake * (c.fornaio ? 0.9 : 1);
  c.batch = tier('mixer').batch; c.knead = tier('mixer').knead;
  c.spoil = tier('fridge').spoil;
  c.manager = staffOf('manager').length > 0;
  c.prepSpeed = 1 + tier('prep').speed + staffOf('prep').length * 0.08 + (c.manager ? 0.1 : 0);
  c.prepQ = tier('prep').q; c.brush = tier('prep').brush;
  c.proofQ = tier('proofer').q; c.proofZone = tier('proofer').zone;
  c.turn = tier('dish').turn / (1 + 0.25 * staffOf('porter').length);
  c.costMult = tier('supplier').mult; c.supQ = tier('supplier').q;
  c.patience = 1 + tier('pos').pat + tier('comfort').pat + skillOf('cashier') * 0.05;
  c.queueCap = 5 + staffOf('cashier').length * 3 + G.upg.pos * 2 + staffOf('pizzaiolo').length * 2;
  c.repMult = 0.4 + G.rep * 0.22;
  const host = staffOf('host')[0];
  c.trafficMult = c.repMult * [1.2, 1, 0.82][G.price] *
    (1 + tier('sign').tr + tier('marketing').tr + tier('pos').tr + tier('comfort').tr + (host ? 0.06 + 0.02 * host.skill : 0));
  c.customers = Math.round(v.traffic * c.trafficMult);
  c.tablesOwned = Math.min(G.tables, v.tables);
  c.tables = Math.min(c.tablesOwned, 2 + staffOf('server').length * 4);
  let dt = G.upg.drinks;
  if (dt >= 3 && !staffOf('bartender').length) dt = 2;
  c.drinks = UPG.drinks.tiers[dt].per * (1 + skillOf('bartender') * 0.06);
  c.delivery = Math.round(staffOf('driver').length * tier('delivery').per * c.repMult);
  c.tip = 1 + tier('furniture').tip + tier('ambience').tip + skillOf('server') * 0.03;
  c.repBonus = tier('ambience').rep;
  c.priceMult = [0.85, 1, 1.2][G.price];
  c.total = c.customers + c.delivery;
  return c;
}

const activeRecipes = () => RECIPES.filter(r => G.menu[r.id] && G.level >= r.lvl);
const recipeIngs = r => [r.sauce, 'mozz', ...r.tops];
const canMake = r => G.dough.n >= 1 && recipeIngs(r).every(i => stock(i) >= 1);
const ingPrice = id => ING[id].price * calc().costMult;

function buy(id, n) {
  const cost = ingPrice(id) * n;
  if (G.cash < cost) return false;
  G.cash -= cost; G.stock[id] = stock(id) + n;
  return true;
}

/* What a day's trade needs, given the active menu */
function parStock() {
  const c = calc(), recs = activeRecipes(), need = {};
  const exp = Math.ceil(c.total * 1.15) + 1;
  if (!recs.length) return { need, exp };
  recs.forEach(r => recipeIngs(r).forEach(i => { need[i] = (need[i] || 0) + exp / recs.length; }));
  for (const k in need) need[k] = Math.ceil(need[k] + (recs.length > 1 ? 2 : 0));
  const batches = Math.max(0, Math.ceil((exp - G.dough.n) / 6));
  need.flour = need.yeast = need.salt = batches;
  return { need, exp };
}
function quickOrder() {
  const { need } = parStock();
  let spent = 0, short = false;
  for (const id in need) {
    const n = Math.max(0, need[id] - stock(id));
    if (!n) continue;
    const afford = Math.min(n, Math.floor(Math.max(0, G.cash) / ingPrice(id)));
    if (afford < n) short = true;
    if (afford > 0) { spent += ingPrice(id) * afford; buy(id, afford); }
  }
  return { spent, short };
}
function quickOrderCost() {
  const { need } = parStock();
  let t = 0;
  for (const id in need) t += Math.max(0, need[id] - stock(id)) * ingPrice(id);
  return t;
}

function addDough(n, q) {
  const d = G.dough;
  d.q = d.n + n ? (d.q * d.n + q * n) / (d.n + n) : 0;
  d.n += n;
}
/* Prep cooks make the morning dough */
function autoDough() {
  const cooks = staffOf('prep');
  if (!cooks.length) return 0;
  const c = calc(), want = Math.ceil(c.total * 1.15) + 1 - G.dough.n;
  const batches = Math.min(Math.ceil(want / 6), stock('flour'), stock('yeast'), stock('salt'));
  if (batches <= 0) return 0;
  ['flour', 'yeast', 'salt'].forEach(i => { G.stock[i] -= batches; });
  const sk = skillOf('prep') / cooks.length;
  addDough(batches * 6, clamp(52 + sk * 7 + c.proofQ, 0, 100));
  return batches * 6;
}

function nextTier(id) { return UPG[id].tiers[G.upg[id] + 1] || null; }
function buyUpgrade(id) {
  const t = nextTier(id);
  if (!t || G.venue < t.v || G.cash < t.c) return false;
  G.cash -= t.c; G.upg[id]++;

}

function roleOpen(k) {
  const r = ROLES[k];

function genCands() {
  G.cands = [];
  for (const k in ROLES) {
    if (!roleOpen(k)) continue;
    for (let i = 0; i < 2; i++) {
      const skill = clamp(1 + Math.floor(Math.random() * (2.2 + G.venue * 0.6)), 1, 4);
      G.cands.push({ id: G.sid++, role: k, name: pick(NAMES), skill, wage: Math.round(ROLES[k].wage * (0.7 + 0.15 * skill) * rnd(0.92, 1.08)) });

  }
}

/* Sound */
const Sound = (() => {
  let ac = null;
  function tone(f, d, type, vol, when) {
    if (!G || G.mute) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + (when || 0);
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
    } catch (e) {}
  }
  return {
    ding: () => { tone(880, 0.25, 'sine', 0.07); tone(1320, 0.3, 'sine', 0.05, 0.08); },
    cash: () => { tone(1200, 0.08, 'square', 0.04); tone(1600, 0.2, 'square', 0.04, 0.07); },
    bad: () => tone(160, 0.3, 'sawtooth', 0.06),
    tap: () => tone(520, 0.05, 'triangle', 0.05),
    up: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.07, i * 0.09)); },
  };
})();

    return `<div class="card"><h4>${u.icon} ${u.name} <span class="pips">${u.tiers.map((_, i) => `<i class="${i <= G.upg[id] ? 'on' : ''}"></i>`).join('')}</span></h4>
      <p><b>${cur.n}</b><small>${cur.d}</small></p>${foot}</div>`;
  };

  const VIEW = {
    home() {
      const c = calc(), v = c.v, recs = activeRecipes(), nv = VENUES[G.venue + 1], l = G.last;
      const missing = [...new Set(recs.flatMap(recipeIngs))].filter(i => stock(i) < 1).map(i => ING[i].name);
      const todo = [];
      if (G.dough.n < 1) todo.push(['bad', 'No dough balls. Make a batch in <b>Dough</b>.']);
      else if (G.dough.n < c.total * 0.7) todo.push(['warn', `${G.dough.n} dough balls for about ${c.total} customers. You may sell out early.`]);
      else todo.push(['ok', `${G.dough.n} dough balls ready (quality ${Math.round(G.dough.q)}).`]);
      if (missing.length) todo.push(['bad', `Out of ${missing.join(', ')}. Visit the <b>Market</b>.`]);
      else todo.push(['ok', 'Every menu item has ingredients in stock.']);
      if (G.cash < 0) todo.push(['bad', 'Overdrawn: the bank charges 5% a day.']);
      if (c.tablesOwned > c.tables) todo.push(['warn', `Only ${c.tables} of ${c.tablesOwned} tables can be served. Hire servers.`]);
      if (G.upg.drinks >= 3 && !staffOf('bartender').length) todo.push(['warn', 'The bar needs a bartender.']);
      if (G.upg.delivery && !staffOf('driver').length) todo.push(['warn', 'Delivery needs a driver.']);
      return `<div class="grid two">
        <div class="card hero"><div class="big">${v.icon}</div><div><h3>${v.name}</h3><p><small>${v.desc}</small></p>
          <div class="stats"><span>👥 ~${c.total} customers today</span><span>🔥 ${tier('oven').n}</span>
          <span>🧑‍🍳 ${G.staff.length} staff · ${money(wages())}/day</span><span>🏷️ ${v.rentName} ${money(v.rent)}/day</span>${c.tablesOwned ? `<span>🍽️ ${c.tables} tables in service</span>` : ''}</div></div></div>
        <div class="card"><h4>Before you open</h4><ul class="todo">${todo.map(t => `<li class="${t[0]}">${t[1]}</li>`).join('')}</ul>
          ${G.day === 1 ? '<p class="hint">First day: make dough, check your stock, then hit <b>Open up</b>. During service you stretch, top, bake and slice every pizza yourself.</p>' : ''}</div>
        ${l ? `<div class="card"><h4>Day ${l.day} takings</h4><div class="stats"><span>🍕 ${l.served} served</span><span>😤 ${l.lost + l.walk} lost</span>
          <span>Avg quality ${l.served ? Math.round(l.qsum / l.served) : 0}</span><span class="${l.profit < 0 ? 'neg' : 'pos'}">Profit ${money(l.profit)}</span></div></div>` : ''}
        <div class="card"><h4>Next step up</h4>${nv ? `<p><b>${nv.icon} ${nv.name}</b><small>${money(nv.cost)} · needs level ${nv.lvl}</small></p>
          <div class="bar"><i style="width:${clamp(G.cash / nv.cost * 100, 0, 100)}%"></i></div>` : '<p>You run the best pizzeria in town. Keep the ovens hot.</p>'}
          <p class="hint">${G.total.pizzas} pizzas sold · ${money(G.total.earned)} earned all-time <button class="link" data-a="reset">${armed === 'reset' ? 'Tap again to wipe your save' : 'Start over'}</button></p></div>
      </div>`;
    },
    market() {
      const used = new Set(activeRecipes().flatMap(recipeIngs)), qc = quickOrderCost(), { exp } = parStock();
      const rows = Object.keys(ING).filter(id => G.level >= ING[id].lvl).map(id => {
        const i = ING[id], p = ingPrice(id), on = used.has(id) || i.kind === 'dough';
        return `<div class="card ing ${on ? '' : 'dim'}"><h4>${i.icon} ${i.name}</h4><p><small>${cents(p)} each${i.perish ? ' · fresh' : ''}</small><b class="${on && stock(id) < 1 ? 'neg' : ''}">Have ${stock(id)}</b></p>
          <div class="buy">${[1, 5, 20].map(n => `<button class="btn sm" data-a="buy" data-id="${id}" data-n="${n}" ${G.cash < p * n ? 'disabled' : ''}>+${n}</button>`).join('')}</div></div>`;
      }).join('');
      return `<div class="strip"><span>One portion tops one pizza. Flour, yeast and salt: one of each makes 6 dough balls. Fresh stock spoils overnight (${Math.round(calc().spoil * 100)}% with your ${tier('fridge').n.toLowerCase()}).</span>
        <button class="btn sm" data-a="quick" ${qc <= 0 ? 'disabled' : ''}>${qc > 0 ? `Stock up for ~${exp} pizzas · ${cents(qc)}` : 'Fully stocked'}</button></div><div class="grid three">${rows}</div>`;
    },
    dough() {
      const c = calc(), can = Math.min(c.batch, stock('flour'), stock('yeast'), stock('salt'));
      return `<div class="grid two"><div class="card"><h4>🫓 Dough balls</h4><div class="big num">${G.dough.n}</div>
        <p><small>Average quality ${Math.round(G.dough.q)} / 100. Better dough lifts every pizza's score.</small></p>
        <p><small>You expect about ${c.total} customers today.</small></p></div>
        <div class="card"><h4>🥣 Make a batch</h4><p><b>${tier('mixer').n}</b><small>Up to ${c.batch * 6} balls per batch. Uses 1 flour, 1 yeast and 1 salt per 6 balls.</small></p>
        <p><small>In stock: 🌾 ${stock('flour')} · 🧫 ${stock('yeast')} · 🧂 ${stock('salt')}</small></p>
        <button class="btn" data-a="doughStart" ${can < 1 ? 'disabled' : ''}>${can < 1 ? 'Buy flour, yeast and salt first' : `Make ${can * 6} dough balls`}</button>
        ${staffOf('prep').length ? '<p class="hint">Your prep cook makes the morning dough automatically when you open.</p>' : ''}</div></div>`;
    },
    menu() {
      const pl = ['Budget', 'Standard', 'Premium'], pd = ['15% cheaper · more customers · forgiving', 'Fair prices', '20% dearer · fewer customers · fussier'];
      return `<div class="strip"><span><b>Pricing:</b> ${pd[G.price]}</span><span class="seg">${pl.map((p, i) => `<button class="${G.price === i ? 'on' : ''}" data-a="price" data-id="${i}">${p}</button>`).join('')}</span></div>
      <div class="grid three">${RECIPES.map(r => {
        const open = G.level >= r.lvl, on = G.menu[r.id];
        return `<div class="card ${open ? '' : 'dim'}"><h4>🍕 ${r.name}</h4><p><small>${recipeIngs(r).map(i => ING[i].icon + ' ' + ING[i].name).join(', ')}</small><b>${cents(r.price * calc().priceMult)}</b></p>
          ${open ? `<button class="btn sm ${on ? '' : 'ghost'}" data-a="menu" data-id="${r.id}">${on ? 'On the menu ✓' : 'Add to menu'}</button>` : `<span class="tag">Unlocks at level ${r.lvl}</span>`}</div>`;
      }).join('')}</div>`;
    },
    boh() { return `<div class="grid three">${Object.keys(UPG).filter(k => UPG[k].area === 'boh').map(upgCard).join('')}</div>`; },
    foh() {
      const v = VENUES[G.venue], c = calc();
      const tables = v.tables ? `<div class="card"><h4>🍽️ Tables <span class="tag">${c.tablesOwned}/${v.tables}</span></h4><p><b>${c.tables} in service</b><small>Dine-in guests tip more and buy drinks. Each server covers 4 tables; you can manage 2 from the counter.</small></p>
        ${c.tablesOwned < v.tables ? `<button class="btn sm" data-a="table" ${G.cash < tableCost() ? 'disabled' : ''}>Add a table ${money(tableCost())}</button>` : '<span class="tag ok">Room is full</span>'}</div>`
        : `<div class="card dim"><h4>🍽️ Tables</h4><p><small>No room for seating here. The Takeaway Shop has window seats.</small></p></div>`;
      return `<div class="grid three">${tables}${Object.keys(UPG).filter(k => UPG[k].area === 'foh').map(upgCard).join('')}</div>`;
    },
    staff() {
      const v = VENUES[G.venue];
      if (G.level < 2) return `<div class="card"><h4>👥 Just you for now</h4><p><small>Reach level 2 and you can take on a pizzaiolo or a counter assistant, even in the van.</small></p></div>`;
      const row = (s, hired) => {
        const r = ROLES[s.role], blk = hired ? '' : hireBlock(s);
        return `<div class="card person"><h4>${r.icon} ${s.name} <span class="tag">${r.name}</span></h4><p><span class="stars">${stars(s.skill)}</span><b>${money(s.wage)}/day</b></p><p><small>${r.desc}</small></p>
          <div class="buy">${hired
            ? `${s.skill < 5 ? `<button class="btn sm" data-a="train" data-id="${s.id}" ${G.cash < trainCost(s) ? 'disabled' : ''}>Train ${money(trainCost(s))}</button>` : '<span class="tag ok">Master</span>'}
               <button class="btn sm ghost" data-a="fire" data-id="${s.id}">${armed === 'fire' + s.id ? 'Sure?' : 'Let go'}</button>`
            : blk ? `<span class="tag">${blk}</span>` : `<button class="btn sm" data-a="hire" data-id="${s.id}">Hire</button>`}</div></div>`;
      };
      return `<div class="strip"><span>Kitchen <b>${areaCount('boh')}/${v.boh}</b> · Front of house <b>${areaCount('foh')}/${v.foh}</b> · Wages <b>${money(wages())}/day</b></span></div>
        ${G.staff.length ? `<h5>Your team</h5><div class="grid three">${G.staff.map(s => row(s, true)).join('')}</div>` : ''}
        <h5>Applicants today</h5><div class="grid three">${G.cands.map(s => row(s, false)).join('') || '<p class="hint">Nobody applied today.</p>'}</div>`;
    },
    property() {
      return `<div class="grid two">${VENUES.map((v, i) => {
        const st = i < G.venue ? '<span class="tag">Outgrown</span>' : i === G.venue ? '<span class="tag ok">You are here</span>'
          : i > G.venue + 1 ? `<span class="tag">Level ${v.lvl} · ${money(v.cost)}</span>`
          : G.level < v.lvl ? `<span class="tag">Needs level ${v.lvl} · ${money(v.cost)}</span>`
          : `<button class="btn sm" data-a="move" data-id="${i}" ${G.cash < v.cost ? 'disabled' : ''}>${armed === 'move' ? 'Confirm: sign the lease' : 'Buy & move in ' + money(v.cost)}</button>`;
        return `<div class="card ${i < G.venue ? 'dim' : ''}"><h4>${v.icon} ${v.name}</h4><p><small>${v.desc}</small></p>
          <div class="stats"><span>👥 ${v.traffic} base footfall</span><span>🏷️ ${money(v.rent)}/day</span><span>🔥 ${v.boh} kitchen staff</span><span>🤵 ${v.foh} front staff</span>${v.tables ? `<span>🍽️ ${v.tables} tables</span>` : ''}</div>${st}</div>`;
      }).join('')}</div><p class="hint">Your equipment, staff and reputation move with you.</p>`;
    },
  };

  function summary(r) {
    const line = (a, b, cls) => `<tr class="${cls || ''}"><td>${a}</td><td>${b}</td></tr>`;
    const ups = [];
    for (let l = r.lvl0 + 1; l <= r.level; l++) ups.push(...unlocksAt(l));
    if (r.ups) Sound.up();
    modal(`<h3>Day ${r.day} closed${r.soldOut ? ' – sold out!' : ''}</h3><div class="sum">
      <table>${line('Pizzas served', `${r.served} (${r.mine} by you)`)}${line('Customers lost', r.lost + r.walk + r.sold)}
        ${line('Average quality', r.served ? Math.round(r.qsum / r.served) : '–')}${line('Reputation', `${r.rep0.toFixed(2)} → ${r.rep1.toFixed(2)}★`)}
        ${line('Spoiled overnight', `${r.spoiled} portions${r.doughLost ? `, ${r.doughLost} dough` : ''}`)}${line('XP earned', '+' + r.xp)}</table>
      <table>${line('Pizza sales', money(r.food))}${r.drinks ? line('Drinks', money(r.drinks)) : ''}${r.deliv ? line('Delivery fees', money(r.deliv)) : ''}${line('Tips', money(r.tips))}
        ${line(r.rentName, money(-r.rent))}${r.wages ? line('Wages', money(-r.wages)) : ''}${r.interest ? line('Overdraft interest', money(-r.interest)) : ''}
        ${line('Profit', money(r.profit), r.profit < 0 ? 'tot neg' : 'tot pos')}</table></div>
      ${r.ups ? `<p class="lvlup">Level ${r.level}! ${ups.length ? 'Unlocked: ' + ups.join(' · ') : ''}</p>` : ''}
      ${r.walk > 3 ? '<p class="hint">Customers walked away from a long queue: more hands or a bigger oven would help.</p>' : ''}
      <button class="btn" data-a="closeModal">Next morning ▶</button>`);
  }

  /* arm-then-confirm for destructive taps (no native dialogs) */
  function arm(key) {
    if (armed === key) { armed = null; return true; }
    armed = key; render();
    setTimeout(() => { if (armed === key) { armed = null; if (!$('#hub').hidden) render(); } }, 3000);
    return false;
  }

  Object.assign(ACT, {
    tab: d => { tab = d.id; $('#pane').scrollTop = 0; render(); },
    mute: () => { G.mute = !G.mute; save(); render(); },
    full: () => {
      const el = document.documentElement;
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else el.requestFullscreen().then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => toast('Full screen is not available here'));
      } catch (e) { toast('Full screen is not available here'); }
    },
    buy: d => { if (buy(d.id, +d.n)) { Sound.tap(); save(); render(); } },
    quick: () => { const r = quickOrder(); toast(r.short ? 'Bought what you could afford' : 'Stocked up: ' + cents(r.spent)); save(); render(); },
    price: d => { G.price = +d.id; save(); render(); },
    menu: d => {
      if (G.menu[d.id] && activeRecipes().length < 2) return toast('Keep at least one pizza on the menu', 'bad');
      G.menu[d.id] = !G.menu[d.id]; save(); render();
    },
    upg: d => { if (buyUpgrade(d.id)) { Sound.cash(); toast('Installed: ' + tier(d.id).n); save(); render(); } },
    table: () => { if (G.cash >= tableCost()) { G.cash -= tableCost(); G.tables++; Sound.cash(); save(); render(); } },
    hire: d => {
      const i = G.cands.findIndex(c => c.id === +d.id);
      if (i < 0 || hireBlock(G.cands[i])) return;
      const s = G.cands.splice(i, 1)[0]; G.staff.push(s);
      toast(s.name + ' joins the team'); Sound.up(); save(); render();
    },
    fire: d => { if (arm('fire' + d.id)) { G.staff = G.staff.filter(s => s.id !== +d.id); save(); render(); } },
    train: d => {
      const s = G.staff.find(s => s.id === +d.id), c = s && trainCost(s);
      if (!s || s.skill >= 5 || G.cash < c) return;
      G.cash -= c; s.skill++; s.wage = Math.round(s.wage * 1.12);
      toast(`${s.name} is now ${s.skill}★`); Sound.up(); save(); render();
    },
    move: d => {
      const v = VENUES[+d.id];
      if (+d.id !== G.venue + 1 || G.level < v.lvl || G.cash < v.cost) return;
      if (!arm('move')) return;
      G.cash -= v.cost; G.venue = +d.id; genCands(); Sound.up(); save(); tab = 'home'; render();
      modal(`<h3>${v.icon} Welcome to the ${v.name}</h3><p>${v.desc}</p><p class="hint">New equipment, staff roles and upgrades are now available. Check Kitchen, Front and Staff.</p><button class="btn" data-a="closeModal">Let's cook</button>`);
    },
    reset: () => { if (arm('reset')) { G = newGame(); genCands(); save(); tab = 'home'; render(); } },
    closeModal: () => { closeModal(); render(); },
    open: () => {
      let msg = [];
      if (calc().manager) { const r = quickOrder(); if (r.spent) msg.push('Manager ordered ' + cents(r.spent) + ' of stock'); }
      const made = autoDough(); if (made) msg.push('Prep cook made ' + made + ' dough balls');
      if (G.dough.n < 1) { tab = 'dough'; render(); return toast('No dough! Make a batch first', 'bad'); }
      if (!activeRecipes().some(canMake)) { tab = 'market'; render(); return toast('You are missing ingredients for every pizza', 'bad'); }
      if (msg.length) toast(msg.join(' · '));
      save(); Service.start();
    },
    doughStart: () => Dough.start(),
  });

  return { screen, render, toast, modal, closeModal, summary };
})();

/* ---------- Dough making: measure, knead, proof ---------- */
const Dough = (() => {
  let D = null, raf = 0, last = 0;
  const ZONE = [62, 74];

  function start() {
    const c = calc(), mult = Math.min(c.batch, stock('flour'), stock('yeast'), stock('salt'));
    if (mult < 1) return;
    ['flour', 'yeast', 'salt'].forEach(i => { G.stock[i] -= mult; });
    D = { c, mult, step: 0, flour: 0, water: 0, lock: {}, hold: null, knead: 0, proof: 0, scores: [], px: null };
    save(); view();
    last = performance.now(); raf = requestAnimationFrame(tick);
  }
  const barScore = v => clamp(100 - Math.max(0, Math.abs(v - 68) - 3) * 7, 0, 100);

  function view() {
    const m = D.mult * 6;
    let h = `<h3>Making ${m} dough balls <small>${['1 · Measure', '2 · Knead', '3 · Proof'][D.step] || ''}</small></h3>`;
    if (D.step === 0) {
      const bar = (k, label, ic) => `<div class="pour"><span>${ic} ${label}</span><div class="meter"><u style="left:${ZONE[0]}%;width:${ZONE[1] - ZONE[0]}%"></u><i id="m-${k}"></i></div>
        <button class="btn hold" id="b-${k}" data-hold="${k}" ${D.lock[k] ? 'disabled' : ''}>${D.lock[k] ? 'Done' : 'Hold to pour'}</button></div>`;
      h += `<p class="hint">Hold each button and let go when the bar is inside the marked zone. Too little or too much throws the hydration off.</p>
        ${bar('flour', 'Flour', '🌾')}${bar('water', 'Water', '💧')}
        <p class="hint">Yeast and a pinch of salt go in too.</p>`;
    } else if (D.step === 1) {
      h += `<p class="hint">Rub back and forth across the dough to knead. Stop in the marked zone: smooth and springy, not overworked.</p>
        <div class="meter"><u style="left:${85 / 1.2}%;width:${20 / 1.2}%"></u><i id="m-knead"></i></div>
        <div id="knead"><div id="blob"></div></div>
        <button class="btn" data-a="doughNext">Dough feels right ▶</button>`;
    } else if (D.step === 2) {
      const z = 8 + D.c.proofZone;
      h += `<p class="hint">The dough is rising. Ball it up when it has doubled, inside the marked zone. Too early is dense, too late collapses.</p>
        <div class="meter"><u style="left:${(100 - z) / 1.3}%;width:${2 * z / 1.3}%"></u><i id="m-proof"></i></div>
        <div class="rise"><div id="rise"></div></div>
        <button class="btn" data-a="doughNext">Ball it up!</button>`;
    } else {
      const q = D.q;
      h = `<h3>${m} dough balls ready</h3><div class="big num">${q}</div><p>Dough quality ${q >= 85 ? '– beautiful, airy dough.' : q >= 65 ? '– good honest dough.' : '– a bit rough. Watch the zones next time.'}</p>
        <p class="hint">Measure ${Math.round((D.scores[0] + D.scores[1]) / 2)} · Knead ${Math.round(D.scores[2])} · Proof ${Math.round(D.scores[3])}${D.c.proofQ ? ' · Proofing kit +' + D.c.proofQ : ''}</p>
        <button class="btn" data-a="closeModal">Done</button>`;
    }
    UI.modal(h);
    if (D && D.step === 1) {
      const k = $('#knead');
      k.addEventListener('pointerdown', e => { e.preventDefault(); D.px = [e.clientX, e.clientY]; });
      k.addEventListener('pointermove', e => {
        if (!D || !D.px) return;
        const d = Math.hypot(e.clientX - D.px[0], e.clientY - D.px[1]);
        D.knead = Math.min(120, D.knead + d * D.c.knead / 26);
        const b = $('#blob');
        if (b) b.style.transform = `translate(${clamp((e.clientX - D.px[0]) * 2, -30, 30)}px,0) scale(${1 + Math.sin(D.knead / 4) * 0.08},${1 - Math.sin(D.knead / 4) * 0.08})`;
        D.px = [e.clientX, e.clientY];
      });
      const end = () => { if (D) D.px = null; };
      k.addEventListener('pointerup', end); k.addEventListener('pointercancel', end); k.addEventListener('pointerleave', end);
    }
  }
  function tick(now) {
    if (!D) return;
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (D.step === 0) {
      if (D.hold && !D.lock[D.hold]) D[D.hold] = Math.min(100, D[D.hold] + dt * 42);
      ['flour', 'water'].forEach(k => { const el = $('#m-' + k); if (el) el.style.width = D[k] + '%'; });
    } else if (D.step === 1) {
      const el = $('#m-knead'); if (el) el.style.width = D.knead / 1.2 + '%';
    } else if (D.step === 2) {
      D.proof += dt * 15;
      const el = $('#m-proof'); if (el) el.style.width = Math.min(100, D.proof / 1.3) + '%';
      const r = $('#rise'); if (r) r.style.transform = `scale(${0.5 + Math.min(D.proof, 130) / 200})`;
      if (D.proof >= 130) next();
    }
    if (D && D.step < 3) raf = requestAnimationFrame(tick);
  }
  function release() {
    if (!D || D.step !== 0 || !D.hold) return;
    const k = D.hold; D.hold = null;
    if (D[k] < 4) return;
    D.lock[k] = true; D.scores[k === 'flour' ? 0 : 1] = barScore(D[k]);
    if (D.lock.flour && D.lock.water) { D.step = 1; Sound.tap(); }
    view();
  }
  function next() {
    if (!D) return;
    if (D.step === 1) {
      const k = D.knead;
      D.scores[2] = k < 85 ? k / 85 * 100 : k <= 105 ? 100 : Math.max(0, 100 - (k - 105) * 5);
      D.step = 2;
    } else if (D.step === 2) {
      const z = 8 + D.c.proofZone;
      D.scores[3] = D.proof >= 130 ? 30 : clamp(100 - Math.max(0, Math.abs(D.proof - 100) - z) * 4, 0, 100);
      D.q = clamp(Math.round(D.scores.reduce((a, b) => a + b, 0) / 4 + D.c.proofQ), 0, 100);
      addDough(D.mult * 6, D.q); D.step = 3; Sound.up(); save();
      view(); D = null; return;
    }
    view();
  }
  document.addEventListener('pointerdown', e => {
    const b = e.target.closest && e.target.closest('[data-hold]');
    if (b && D && !b.disabled) { e.preventDefault(); D.hold = b.dataset.hold; }
  });
  document.addEventListener('pointerup', release);
  document.addEventListener('pointercancel', release);
  ACT.doughNext = next;
  return { start, active: () => !!D };
})();

/* ---------- boot ---------- */
function boot() {
  if (!load()) { G = newGame(); genCands(); }
  if (!G.cands.length) genCands();
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]');
    if (!el || el.disabled) return;
    const f = ACT[el.dataset.a];
    if (f) f(el.dataset, el);
  });
  document.addEventListener('contextmenu', e => e.preventDefault());

/* Crust Empire – live service: tickets, the bench, the oven, the cutting board */
const Service = (() => {
  const W = 320, CX = 160, CY = 160, R = 108, NS = 24, CELL = 12, DAY = 180;
  const cells = [];
  for (let y = CELL / 2; y < W; y += CELL) for (let x = CELL / 2; x < W; x += CELL)

  /* ---------- pizza model ---------- */
  function newPizza(tk) {

  function scorePizza(pz) {
    const rec = pz.rec, c = S.c;
    const p = { stretch: stretchScore(pz), sauce: pz.sauce === rec.sauce ? cov(pz.sauceCells) : 0, cheese: cov(pz.cheeseCells),
      tops: rec.tops.reduce((a, t) => a + topScore(pz, t), 0) / rec.tops.length, bake: bakeScore(pz.bake), cut: cutScore(pz) };

  /* ---------- simulation ---------- */
  function spawn() {

    if (S.tickets.length >= c.queueCap) { S.r.walk++; return; }

  function draw() {

    if (board) { g.fillStyle = '#c69a62'; g.beginPath(); g.arc(CX, CY, R * 1.3, 0, 7); g.fill(); g.strokeStyle = '#a57c48'; g.lineWidth = 3; g.stroke(); }
    else { g.fillStyle = 'rgba(255,255,255,.07)'; for (let i = 0; i < 40; i++) g.fillRect((i * 97) % W, (i * 53) % W, 3, 3); }
    const pz = board ? S.board[0] : S.bench;
    g.textAlign = 'center'; g.font = '600 15px Nunito, system-ui, sans-serif';
    if (!pz) {
      g.fillStyle = 'rgba(20,30,24,.75)';
      g.fillText(G.dough.n < 1 ? 'Out of dough balls' : 'Tap a ticket to start a pizza', CX, CY - 6);
      g.font = '13px Nunito, system-ui, sans-serif';
      g.fillText(G.dough.n + ' dough ball' + (G.dough.n === 1 ? '' : 's') + ' left', CX, CY + 16);
      return;
    }
    if (pz.stage === 'stretch') {
      g.setLineDash([6, 6]); g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 2;
      g.beginPath(); g.arc(CX, CY, R, 0, 7); g.stroke(); g.setLineDash([]);
    }
    drawPizza(pz, board);
    if (board && ptr) { g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 2; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(ptr.sx, ptr.sy); g.lineTo(ptr.x, ptr.y); g.stroke(); g.setLineDash([]); }
  }

  /* ---------- DOM ---------- */
  function sync(box, items, key, make, upd) {
    const have = new Map();
    [...box.children].forEach(el => have.set(el.dataset.k, el));
    items.forEach(it => {
      const k = String(key(it));
      let el = have.get(k);
      if (!el) { el = make(it); el.dataset.k = k; box.appendChild(el); } else have.delete(k);
      upd(el, it);
    });
    have.forEach(el => el.remove());
  }
  const TYPE = { take: '🥡', dine: '🍽️', deliv: '🛵' };
  function renderUI() {
    const c = S.c, pz = S.view === 'board' ? S.board[0] : S.bench;
    $('#sv-clock').style.width = clamp(S.t / DAY * 100, 0, 100) + '%';
    $('#sv-time').textContent = S.t >= DAY ? 'Last orders' : ['Lunch', 'Afternoon', 'Dinner rush', 'Late'][Math.min(3, Math.floor(S.t / DAY * 4))];
    $('#sv-cash').textContent = money(G.cash);
    $('#sv-rep').textContent = G.rep.toFixed(1) + '★';
    $('#sv-dough').textContent = '🫓 ' + G.dough.n;
    $('#sv-count').textContent = `Served ${S.r.served} · Lost ${S.r.lost + S.r.walk}`;
    sync($('#tickets'), S.tickets.slice(0, 12), t => t.id, t => {
      const el = document.createElement('button');
      el.className = 'tk'; el.dataset.a = 'claim'; el.dataset.id = t.id;
      el.innerHTML = `<span class="tk-h"><b>#${t.id} ${t.rec.name}</b><span>${TYPE[t.type]}</span></span>
        <span class="tk-ing">${recipeIngs(t.rec).map(i => ING[i].icon).join(' ')}</span><span class="tk-own"></span><span class="tk-bar"><i></i></span>`;
      return el;
    }, (el, t) => {
      const f = t.pat / t.max;
      el.querySelector('i').style.width = f * 100 + '%';
      el.querySelector('i').className = f < 0.25 ? 'low' : f < 0.5 ? 'mid' : '';
      el.classList.toggle('mine', t.owner === 'me'); el.classList.toggle('staff', !!t.owner && t.owner !== 'me');
      el.querySelector('.tk-own').textContent = t.owner === 'me' ? 'You' : t.owner ? '👨‍🍳 ' + t.owner : 'Tap to make';
    });
    $('#tk-more').textContent = S.tickets.length > 12 ? `+${S.tickets.length - 12} more waiting` : S.tickets.length ? '' : 'No orders yet…';
    const mine = S.oven.filter(o => o.owner === 'me');
    sync($('#oven-slots'), mine, o => o.pz.id, o => {
      const el = document.createElement('button');
      el.className = 'slot'; el.dataset.a = 'pull'; el.dataset.id = o.pz.id;
      el.innerHTML = `<span>${o.pz.rec.name}</span><span class="slot-bar"><u></u><i></i></span><em></em>`;
      return el;
    }, (el, o) => {
      el.querySelector('i').style.width = clamp(o.p / 1.6 * 100, 0, 100) + '%';
      const st = o.p < 0.92 ? 'Baking…' : o.p <= 1.12 ? 'PERFECT – pull!' : o.p < 1.4 ? 'Overdone!' : 'Burning!';
      el.querySelector('em').textContent = st;
      el.className = 'slot ' + (o.p < 0.92 ? '' : o.p <= 1.12 ? 'ok' : 'burn');
    });
    $('#oven-head').textContent = `Oven ${S.oven.length}/${c.slots}` + (S.oven.length - mine.length ? ` · ${S.oven.length - mine.length} staff` : '');
    if (!dirty) return;
    dirty = false;
    $('#tab-bench').classList.toggle('on', S.view === 'bench');
    $('#tab-board').classList.toggle('on', S.view === 'board');
    $('#tab-board').textContent = `Cutting board (${S.board.length})`;
    const nb = $('#sv-next'), bb = $('#sv-bin');
    nb.hidden = bb.hidden = !pz;
    if (pz) nb.textContent = S.view === 'board' ? 'Serve 🛎️' : pz.stage === 'stretch' ? 'Dough ready ▶' : 'Into the oven 🔥';
    // checklist + palette
    let h = '';
    if (!pz) h = '<p class="hint">Tap an order on the left, stretch the dough, top it, bake it, slice it, serve it.</p>';
    else if (S.view === 'board') h = `<p class="hint"><b>#${pz.tk.id} ${pz.rec.name}</b><br>Swipe across the pizza to slice it. 3 cuts through the middle, then serve.</p><p class="hint">Cuts: ${pz.cuts.length}/3</p>`;
    else if (pz.stage === 'stretch') h = `<p class="hint"><b>#${pz.tk.id} ${pz.rec.name}</b><br>Drag from the middle outward, all the way round, until the dough fills the dotted ring.</p><p class="hint">Evenness ${Math.round(stretchScore(pz) * 100)}%</p>`;
    else {
      const rec = pz.rec, pc = v => Math.round(v * 100) + '%';
      const row = (id, v) => `<li class="${v >= 0.8 ? 'done' : ''}">${ING[id].icon} ${ING[id].name}<b>${pc(v)}</b></li>`;
      h = `<ul class="check"><li class="head">#${pz.tk.id} ${rec.name}</li>${row(rec.sauce, pz.sauce === rec.sauce ? cov(pz.sauceCells) : 0)}${row('mozz', cov(pz.cheeseCells))}${rec.tops.map(t => row(t, topScore(pz, t))).join('')}</ul><div class="pal">`;
      const used = new Set(); activeRecipes().forEach(r => recipeIngs(r).forEach(i => used.add(i)));
      [...used].forEach(id => {
        const need = recipeIngs(rec).includes(id), on = pz.sauce === id || (id === 'mozz' && pz.cheese) || pz.tops.some(t => t.t === id);
        h += `<button class="pb ${S.tool === id ? 'sel' : ''} ${need ? 'need' : ''}" data-a="tool" data-id="${id}" ${stock(id) < 1 && !on ? 'disabled' : ''}>${ING[id].icon}<small>${stock(id)}</small></button>`;
      });
      h += '</div>';
    }
    $('#sv-side').innerHTML = h;
  }
  function fit() {
    if (!cv) return;
    const box = cv.parentElement, s = Math.floor(Math.min(box.clientWidth, box.clientHeight));
    cv.style.width = cv.style.height = s + 'px';
  }
  function loop(now) {
    if (!S) return;
    const real = Math.min(0.1, (now - last) / 1000 || 0); last = now;
    for (let i = 0; S && i < S.speed; i++) step(real);
    if (!S) return;
    if (popT > 0 && (popT -= real) <= 0) $('#sv-pop').hidden = true;
    draw();
    uiClock += real;
    if (uiClock > 0.1 || dirty) { uiClock = 0; renderUI(); }
    raf = requestAnimationFrame(loop);
  }

  function start() {
    const c = calc();
    S = { c, t: 0, acc: 0.75, speed: 1, tickets: [], nid: 1, bench: null, oven: [], board: [], tool: null, view: 'bench',
      workers: staffOf('pizzaiolo').map(s => ({ s, job: null, left: 0 })), tablesBusy: 0, eating: [],
      r: { day: G.day, served: 0, mine: 0, lost: 0, walk: 0, sold: 0, food: 0, tips: 0, drinks: 0, deliv: 0, qsum: 0, xp: 0, rep0: G.rep, lvl0: G.level } };
    $('#service').innerHTML = `
      <div class="sv-top">
        <span class="sv-time"><b id="sv-time"></b><span class="clock"><i id="sv-clock"></i></span></span>
        <span id="sv-count"></span><span id="sv-dough"></span><span id="sv-rep"></span><b id="sv-cash"></b>
        <button class="btn sm" data-a="speed" id="sv-speed">1×</button>
        <button class="btn sm ghost" data-a="closeEarly" id="sv-close">Close up</button>
      </div>
      <div class="sv-body">
        <div class="sv-left"><h4>Orders</h4><div id="tickets"></div><p id="tk-more" class="hint"></p></div>
        <div class="sv-mid">
          <div class="tabs"><button id="tab-bench" data-a="view" data-id="bench">Bench</button><button id="tab-board" data-a="view" data-id="board">Cutting board</button></div>
          <div class="cv-box"><canvas id="cv"></canvas><div id="sv-pop" hidden></div></div>
          <div class="sv-btns"><button class="btn ghost" id="sv-bin" data-a="bin">🗑 Bin</button><button class="btn" id="sv-next" data-a="next"></button></div>
        </div>
        <div class="sv-right"><div id="sv-side"></div><div class="oven"><h4 id="oven-head">Oven</h4><div id="oven-slots"></div></div></div>
      </div>`;
    UI.screen('service');
    cv = $('#cv'); const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = cv.height = W * dpr; ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cv.addEventListener('pointerdown', down); cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    fit(); dirty = true; last = performance.now(); closeArmed = 0;
    raf = requestAnimationFrame(loop);
  }

  function finish(soldOut) {
    cancelAnimationFrame(raf);
    const r = S.r, v = S.c.v, sp = S.c.spoil;
    S = null;
    r.soldOut = !!soldOut;
    r.rent = v.rent; r.rentName = v.rentName; r.wages = wages();
    r.interest = G.cash < 0 ? -G.cash * 0.05 : 0;
    G.cash -= r.rent + r.wages + r.interest;
    r.spoiled = 0;
    const rot = n => clamp(Math.round(n * sp + rnd(-0.5, 0.5)), 0, n);
    for (const id in G.stock) if (ING[id].perish) { const l = rot(G.stock[id]); G.stock[id] -= l; r.spoiled += l; }
    r.doughLost = rot(G.dough.n); G.dough.n -= r.doughLost;
    r.xp = Math.round(r.xp + 20);
    r.ups = addXP(r.xp); r.level = G.level; r.rep1 = G.rep;
    r.profit = r.food + r.tips + r.drinks + r.deliv - r.rent - r.wages - r.interest;
    G.day++; genCands(); G.last = r; save();
    UI.screen('hub'); UI.summary(r);
  }

  let closeArmed = 0;
  Object.assign(ACT, {
    claim: d => S && claim(d.id), next: () => S && next(), bin: () => S && bin(), pull: d => S && pull(d.id),
    tool: d => { if (S) { S.tool = d.id; dirty = true; Sound.tap(); } },
    view: d => { if (S) { S.view = d.id; dirty = true; } },
    speed: () => { if (!S) return; const max = S.workers.length ? 8 : 4; S.speed = S.speed >= max ? 1 : S.speed * 2; $('#sv-speed').textContent = S.speed + '×'; },
    closeEarly: () => {
      if (!S) return;
      if (Date.now() - closeArmed < 3000) return finish(false);
      closeArmed = Date.now(); $('#sv-close').textContent = 'Tap again to close';
      setTimeout(() => { const b = $('#sv-close'); if (b) b.textContent = 'Close up'; }, 3000);
    },
  });
  window.addEventListener('crust-layout', fit);
  return { start, active: () => !!S, _s: () => S };
})();

boot();
</script>
